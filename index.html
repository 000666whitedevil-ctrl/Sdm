<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Shiv Dutt Mishra — Mathematician, Educator, Researcher and Builder.">
  <title>Shiv Dutt Mishra — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#080808;--ivory:#f4eee4;--muted:#bdb6ad;--red:#ed102d}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--ivory);font-family:"DM Sans",sans-serif}
    a{color:inherit;text-decoration:none}
    .header{position:absolute;z-index:5;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,5.8vw,98px);border-bottom:1px solid rgba(244,238,228,.28);background:linear-gradient(180deg,rgba(7,7,7,.42),transparent)}
    .brand{font:600 34px "Cormorant Garamond",serif;letter-spacing:.09em;white-space:nowrap}
    .brand:after{content:"";display:inline-block;height:38px;border-left:1px solid #827d76;margin-left:34px;vertical-align:middle}
    nav{display:flex;gap:clamp(20px,3.4vw,58px);align-items:center}
    nav a{position:relative;font:500 16px "Cormorant Garamond",serif;transition:color .2s}
    nav a:hover{color:#fff}
    nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:-25px;height:3px;background:var(--red)}
    .availability{border:1px solid rgba(244,238,228,.5);border-radius:30px;padding:10px 18px;font:14px "Cormorant Garamond",serif;white-space:nowrap}
    .availability i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#00c66a;margin-right:10px;box-shadow:0 0 12px #00c66a}
    .hero{position:relative;min-height:100svh;overflow:hidden;display:grid;place-items:center;background:#090909}
    .hero-art{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center}
    .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.06),transparent 55%,rgba(0,0,0,.02));pointer-events:none}
    .hit{position:absolute;z-index:3;display:block}
    .home{top:0;left:28.5%;width:6%;height:8%}.about{top:0;left:35%;width:6%;height:8%}
    .projects{top:0;left:42%;width:7%;height:8%}.research{top:0;left:49%;width:8%;height:8%}
    .experience{top:0;left:57%;width:9%;height:8%}.contact{top:0;left:66%;width:8%;height:8%}
    .explore{left:5.5%;bottom:7%;width:15.5%;height:8%}.intro{left:22.5%;bottom:7%;width:13%;height:8%}
    .hit:focus-visible{outline:2px solid var(--red);outline-offset:-4px;border-radius:8px}
    .mobile-note{display:none}
    @media(max-width:900px){
      .header{height:64px;padding:0 18px}.brand{font-size:27px}.brand:after{height:28px;margin-left:16px}
      nav{display:none}.availability{font-size:12px;padding:8px 12px}.hero{min-height:100svh}
      .hero-art{object-fit:cover;object-position:50% 50%}
      .mobile-note{display:block;position:absolute;z-index:4;bottom:14px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.08em;pointer-events:none}
      .home,.about,.projects,.research,.experience,.contact{display:none}
      .explore{left:5%;bottom:6%;width:38%;height:8%}.intro{left:45%;bottom:6%;width:34%;height:8%}
    }
    @media(max-width:520px){.hero-art{object-position:52% center}.availability{font-size:11px}.brand{font-size:24px}}
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="#home" aria-label="Shiv Dutt Mishra home">S.D.M.</a>
    <nav aria-label="Main navigation">
      <a class="active" href="#home">Home</a><a href="#about">About</a><a href="#projects">Projects</a>
      <a href="#research">Research</a><a href="#experience">Experience</a><a href="#contact">Contact</a>
    </nav>
    <a class="availability" href="mailto:shivduttmishra@gmail.com"><i></i>Available for Collaboration</a>
  </header>
  <main>
    <section class="hero" id="home" aria-label="Shiv Dutt Mishra portfolio landing page">
      <img class="hero-art" src="assets/landing-reference.png" alt="Shiv Dutt Mishra portfolio landing page artwork">
      <div class="shade"></div>
      <a class="hit home" href="#home" aria-label="Home"></a><a class="hit about" href="#about" aria-label="About"></a>
      <a class="hit projects" href="#projects" aria-label="Projects"></a><a class="hit research" href="#research" aria-label="Research"></a>
      <a class="hit experience" href="#experience" aria-label="Experience"></a><a class="hit contact" href="#contact" aria-label="Contact"></a>
      <a class="hit explore" href="#projects" aria-label="Explore my work"></a><a class="hit intro" href="#about" aria-label="Watch intro"></a>
      <span class="mobile-note">SCROLL TO EXPLORE</span>
    </section>
  </main>
  <script>
    // The following anchors are intentionally prepared for the next build phase.
    document.querySelectorAll('a[href^="#"]').forEach(link=>{
      link.addEventListener('click',event=>{
        const target=document.querySelector(link.getAttribute('href'));
        if(target){event.preventDefault();target.scrollIntoView({behavior:'smooth'});}
      });
    });
  </script>
</body>
</html>
